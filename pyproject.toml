[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-dataset-crawler"
version = "0.1.0"
description = "Production-grade Music Dataset Crawler and Vietnamese Music Detection Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Team" }
]
dependencies = [
    "requests>=2.28.0",
    "mutagen>=1.47.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "kaggle>=1.5.0",
]

[project.scripts]
music-dataset = "music_dataset.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
